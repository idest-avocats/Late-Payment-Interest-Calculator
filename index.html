// ===== Moteur de calcul des intérêts moratoires / Default interest engine =====
// id est avocats, outil d'aide au calcul. À vérifier dans chaque cas.
// SPDX-License-Identifier: AGPL-3.0-or-later
const Interets = (() => {
  const DAY = 86400000;
  const dn = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);
  const ymd = n => { const t = new Date(n * DAY); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; };
  const parseISO = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? dn(+m[1], +m[2], +m[3]) : null; };
  const toISO = n => { const a = ymd(n); return `${a.y}-${String(a.m).padStart(2, '0')}-${String(a.d).padStart(2, '0')}`; };
  const MONTHS = {
    fr: ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'],
    en: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
  };
  const fmtShort = n => { const a = ymd(n); return `${String(a.d).padStart(2, '0')}.${String(a.m).padStart(2, '0')}.${a.y}`; };
  const fmtLong = (n, lang = 'fr') => { const a = ymd(n); return lang === 'en' ? `${a.d} ${MONTHS.en[a.m - 1]} ${a.y}` : `${a.d === 1 ? '1er' : a.d} ${MONTHS.fr[a.m - 1]} ${a.y}`; };
  const round2 = x => Math.round((x + Number.EPSILON) * 100) / 100;
  const fmtCHF = x => {
    const neg = x < 0, s = Math.abs(round2(x)).toFixed(2), [i, d] = s.split('.');
    return (neg ? '−' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, "'") + '.' + d;
  };
  const fmtRate = (r, lang = 'fr') => { const s = String(Math.round(r * 100) / 100); return lang === 'en' ? s : s.replace('.', ','); };

  // Nombre de jours entre from (inclus) et toExcl (exclu)
  function days(from, toExcl, basis) {
    if (toExcl <= from) return 0;
    if (basis === 'e30360') {
      const a = ymd(from), b = ymd(toExcl);
      const d1 = Math.min(a.d, 30), d2 = Math.min(b.d, 30);
      return Math.max(0, 360 * (b.y - a.y) + 30 * (b.m - a.m) + (d2 - d1));
    }
    return toExcl - from;
  }
  const denom = basis => basis === 'act365' ? 365 : 360;
  const interest = (cap, rate, d, basis) => round2(cap * rate / 100 * d / denom(basis));

  // c : { amount, rate, start, end, basis, incl, payments:[{date, amount}] }
  // notes : { k: 'excess' | 'beforeStart' | 'afterEnd', date, amount }
  function computeClaim(c) {
    let capital = c.amount, backlog = 0, last = c.start, backlogFrom = c.start;
    const lines = [], notes = [];
    const pays = (c.payments || []).slice().sort((a, b) => a.date - b.date);
    const toCapitalOnly = p => {
      const toCap = Math.min(p.amount, capital), excess = round2(p.amount - toCap);
      capital = round2(capital - toCap);
      lines.push({ type: 'pay', date: p.date, amount: p.amount, toInterest: 0, toCapital: toCap, excess });
      if (excess > 0) notes.push({ k: 'excess', date: p.date, amount: excess });
    };
    if (!(c.rate > 0)) {
      pays.forEach(toCapitalOnly);
      return { capital, backlog: 0, interestTotal: 0, interestFrom: null, lines, notes };
    }
    for (const p of pays) {
      if (p.date < c.start) { toCapitalOnly(p); notes.push({ k: 'beforeStart', date: p.date }); continue; }
      if (p.date > c.end) { notes.push({ k: 'afterEnd', date: p.date }); continue; }
      const d = days(last, p.date, c.basis);
      if (d > 0) {
        const i = interest(capital, c.rate, d, c.basis);
        lines.push({ type: 'period', from: last, to: p.date - 1, days: d, capital, rate: c.rate, interest: i });
        backlog = round2(backlog + i);
      }
      let pay = p.amount;
      const toInterest = Math.min(pay, backlog); backlog = round2(backlog - toInterest); pay = round2(pay - toInterest);
      const toCapital = Math.min(pay, capital); capital = round2(capital - toCapital);
      const excess = round2(pay - toCapital);
      lines.push({ type: 'pay', date: p.date, amount: p.amount, toInterest, toCapital, excess });
      if (excess > 0) notes.push({ k: 'excess', date: p.date, amount: excess });
      if (backlog === 0) backlogFrom = p.date;
      last = p.date;
    }
    const endExcl = c.incl ? c.end + 1 : c.end;
    const d = days(last, endExcl, c.basis);
    let final = 0;
    if (d > 0 && capital > 0) {
      final = interest(capital, c.rate, d, c.basis);
      lines.push({ type: 'period', from: last, to: endExcl - 1, days: d, capital, rate: c.rate, interest: final });
    }
    return { capital, backlog, backlogFrom, backlogTo: last - 1, interestTotal: round2(backlog + final), interestFrom: last, lines, notes };
  }

  return { dn, ymd, parseISO, toISO, fmtShort, fmtLong, fmtCHF, fmtRate, round2, days, computeClaim };

      <div><label data-i18n="lbAmount"></label><input type="number" class="p-amount" min="0" step="0.01" inputmode="decimal" value="${data.amount ?? ''}"></div>
    </div>`;
  el.querySelector('.del').onclick = () => { el.remove(); update(); };
  el.querySelectorAll('input,select').forEach(i => { i.addEventListener('input', update); i.addEventListener('change', update); });
  $('#pays').appendChild(el);
  translate(el); refreshPaySelects();
  return el;
}
function renumber() {
  [...document.querySelectorAll('#claims .card')].forEach((c, i) => { c.querySelector('.cl-title').textContent = T().claimN(i + 1); });
  refreshPaySelects();
}
function refreshPaySelects() {
  const claims = [...document.querySelectorAll('#claims .card')];
  document.querySelectorAll('.p-claim').forEach(sel => {
    const prev = sel.value;
    sel.innerHTML = claims.map((c, i) => `<option value="${c.dataset.id}">${T().claimN(i + 1)}</option>`).join('');
    if (claims.some(c => c.dataset.id === prev)) sel.value = prev;
  });
}

// ---------- Traduction ----------
function translate(root = document) {
  const t = T();
  root.querySelectorAll('[data-i18n]').forEach(e => { const v = t[e.dataset.i18n]; if (typeof v === 'string') e.textContent = v; });
  root.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t[e.dataset.i18nHtml]; });
  root.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t[e.dataset.i18nPh]; });
  root.querySelectorAll('[data-i18n-title]').forEach(e => { e.title = t[e.dataset.i18nTitle]; });
  root.querySelectorAll('[data-i18n-aria]').forEach(e => { e.setAttribute('aria-label', t[e.dataset.i18nAria]); });
}
function applyLang() {
  const t = T();
  document.documentElement.lang = LANG;
  document.title = t.pageTitle;
  translate();
  $('#principles').innerHTML = t.principles.map(p => `<li>${p}</li>`).join('');
  $('#disclaimerText').innerHTML = t.disclaimer.map(p => `<p>${p}</p>`).join('');
  document.querySelectorAll('[data-lang-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.langSet === LANG)));
  document.querySelectorAll('.note-lang').forEach(n => { n.hidden = !n.textContent; });
  renumber(); setSource(); update();
}

const num = v => { const x = parseFloat(String(v).replace(',', '.')); return Number.isFinite(x) ? x : null; };
function readClaims() {
  return [...document.querySelectorAll('#claims .card')].map((c, i) => ({
    id: c.dataset.id, no: i + 1,
    label: c.querySelector('.f-label').value.trim(),
    amount: num(c.querySelector('.f-amount').value),
    start: I.parseISO(c.querySelector('.f-start').value),
    rate: num(c.querySelector('.f-rate').value),
    end: I.parseISO(c.querySelector('.f-end').value),
  }));
}
function readPays() {
  return [...document.querySelectorAll('#pays .card')].map(p => ({
    claim: p.querySelector('.p-claim').value,
    date: I.parseISO(p.querySelector('.p-date').value),
    amount: num(p.querySelector('.p-amount').value),
  }));
}

// ---------- Calcul et affichage ----------
function update() {
  const t = T();
  const calc = I.parseISO($('#calc').value);
  const basis = $('#basis').value, incl = $('#incl').checked, r05 = $('#r05').checked;
  const claims = readClaims(), pays = readPays();
  const alerts = [], results = [];
  let totCap = 0, totInt = 0;
  claims.forEach(c => {
    const end = c.end ?? calc;
    if (c.amount === null || c.amount <= 0) { if (c.amount !== null) alerts.push({ lvl: 'warn', html: t.aAmount(c.no) }); return; }
    if (c.rate === null || c.rate < 0) { alerts.push({ lvl: 'warn', html: t.aRate(c.no) }); return; }
    if (c.rate > 0 && c.start === null) { alerts.push({ lvl: 'info', html: t.aStart(c.no) }); return; }
    if (c.rate > 0 && end === null) { alerts.push({ lvl: 'info', html: t.aCalc }); return; }
    if (c.rate > 0 && end < c.start) { alerts.push({ lvl: 'bad', html: t.aOrder(c.no) }); return; }
    if (c.rate > 0 && c.rate < 5) alerts.push({ lvl: 'warn', html: t.aLow(c.no, fr(c.rate)) });
    if (c.rate > 5) alerts.push({ lvl: 'info', html: t.aHigh(c.no, fr(c.rate)) });
    const cp = pays.filter(p => p.claim === c.id && p.date !== null && p.amount !== null && p.amount > 0);
    const r = I.computeClaim({ amount: c.amount, rate: c.rate, start: c.start, end: c.rate > 0 ? end : (c.start ?? end ?? 0), basis, incl, payments: cp });
    r.notes.forEach(n => alerts.push({ lvl: 'info', html: n.k === 'excess' ? t.nExcess(c.no, fs(n.date), fmt(n.amount)) : n.k === 'beforeStart' ? t.nBefore(c.no, fs(n.date)) : t.nAfter(c.no, fs(n.date)) }));
    results.push({ c, r });
    totCap += r.capital; totInt += r.interestTotal;
  });
  if (pays.some(p => p.amount && p.date && !claims.some(c => c.id === p.claim))) alerts.push({ lvl: 'warn', html: t.aOrphan });
  $('#rAlerts').innerHTML = alerts.map(x => `<div class="alert ${x.lvl}">${x.html}</div>`).join('');
  $('#rTitle').textContent = calc !== null ? t.totalDueAt(fs(calc)) : t.totalDue;

  if (!results.length) {
    $('#rTotal').className = 'total empty'; $('#rTotal').textContent = t.emptyTotal;
    $('#rKpis').innerHTML = ''; $('#rDetails').hidden = true;
    return;
  }
  totCap = I.round2(totCap); totInt = I.round2(totInt);
  let total = I.round2(totCap + totInt);
  if (r05) total = Math.round(total * 20) / 20;
  $('#rTotal').className = 'total'; $('#rTotal').textContent = `CHF ${fmt(total)}`;
  $('#rKpis').innerHTML = `<span class="kpi">${t.kCap}<b>CHF ${fmt(totCap)}</b></span><span class="kpi">${t.kInt}<b>CHF ${fmt(totInt)}</b></span><span class="kpi">${t.kClaims}<b>${results.length}</b></span>`;

  // Tableau
  let html = `<thead><tr><th>${t.thItem}</th><th>${t.thFrom}</th><th>${t.thTo}</th><th>${basis === 'e30360' ? t.thDays30 : t.thDays}</th><th>${t.thCap}</th><th>${t.thRate}</th><th>${t.thInt}</th></tr></thead><tbody>`;
  results.forEach(({ c, r }) => {
    html += `<tr class="cr"><td colspan="7">${t.claimN(c.no)}${c.label ? (LANG === 'en' ? ': ' : ' : ') + esc(c.label) : ''} (CHF ${fmt(c.amount)})</td></tr>`;
    r.lines.forEach(l => {
      if (l.type === 'period') html += `<tr><td>${t.rowInt}</td><td>${fs(l.from)}</td><td>${fs(l.to)}</td><td>${l.days}</td><td>${fmt(l.capital)}</td><td>${fr(l.rate)}${LANG === 'en' ? '%' : ' %'}</td><td>${fmt(l.interest)}</td></tr>`;
      else html += `<tr><td colspan="6">${t.rowPay(fs(l.date), fmt(l.amount), fmt(l.toInterest), fmt(l.toCapital), l.excess ? fmt(l.excess) : '')}</td><td>−${fmt(l.amount - (l.excess || 0))}</td></tr>`;
    });
    html += `<tr class="sum"><td>${t.rowBal(c.no)}</td><td colspan="3"></td><td>${fmt(r.capital)}</td><td></td><td>${fmt(r.interestTotal)}</td></tr>`;
  });
  html += `<tr class="sum"><td>${t.rowTotal}</td><td colspan="3"></td><td>${fmt(totCap)}</td><td></td><td>${fmt(totInt)}</td></tr></tbody>`;
  $('#rTable').innerHTML = html;

  // Réquisition de poursuite / Debt collection request
  const lp = []; let k = 0;
  results.forEach(({ c, r }) => {
    const cause = c.label || t.claimN(c.no);
    if (r.capital > 0) { k++; lp.push(c.rate > 0 ? t.lpWith(k, fmt(r.capital), fr(c.rate), fs(r.interestFrom), cause) : t.lpWithout(k, fmt(r.capital), cause)); }
    if (r.backlog > 0) { k++; lp.push(t.lpBacklog(k, fmt(r.backlog), fr(c.rate), cause, fs(r.backlogFrom), fs(r.backlogTo))); }
  });
  $('#txtLP').value = lp.join('\n\n');

  // Conclusions / Prayers for relief
  const items = [];
  results.forEach(({ c, r }) => {
    if (r.capital > 0) items.push(c.rate > 0 ? t.cWith(fmt(r.capital), fr(c.rate), fl(r.interestFrom)) : t.cWithout(fmt(r.capital)));
    if (r.backlog > 0) items.push(t.cBacklog(fmt(r.backlog), fl(r.backlogTo)));
  });
  const letters = 'abcdefghijklmnopqrstuvwxyz';
  $('#txtConcl').value = items.length === 1 ? t.cOne(items[0])
    : `${t.cMany}\n${items.map((x, i) => (LANG === 'en' ? `(${letters[i]}) ` : `${letters[i]}) `) + x + (i < items.length - 1 ? (LANG === 'en' ? ';' : ' ;') : '.')).join('\n')}`;

  // Décompte chiffré / Interest statement
  const dc = [t.dcTitle(calc !== null ? fs(calc) : ''), t.dcBasis($('#basis').selectedOptions[0].textContent, incl), ''];
  results.forEach(({ c, r }) => {
    dc.push(t.dcClaim(c.no, c.label, fmt(c.amount)));
    r.lines.forEach(l => dc.push(l.type === 'period'
      ? t.dcPeriod(fr(l.rate), fmt(l.capital), fs(l.from), fs(l.to), l.days, fmt(l.interest))
      : t.dcPay(fs(l.date), fmt(l.amount), fmt(l.toInterest), fmt(l.toCapital), l.excess ? fmt(l.excess) : '')));
    dc.push(t.dcBal(fmt(r.capital), fmt(r.interestTotal)), '');
  });
  dc.push(t.dcTotal(fmt(totCap), fmt(totInt), fmt(total), r05));
  $('#txtDc').value = dc.join('\n');
  ['#txtLP', '#txtConcl', '#txtDc'].forEach(s => { const ta = $(s); ta.rows = Math.min(18, ta.value.split('\n').length + 1); });
  $('#rDetails').hidden = false;
}

// ---------- Événements ----------
['#calc', '#basis', '#incl', '#r05'].forEach(s => { $(s).addEventListener('input', update); $(s).addEventListener('change', update); });
$('#rate').addEventListener('input', () => {
  document.querySelectorAll('.f-rate').forEach(i => { if (!i.dataset.touched) i.value = $('#rate').value; });
  update();
});
$('#addClaim').onclick = () => { claimCard(); update(); };
$('#addPay').onclick = () => { if (!document.querySelector('#claims .card')) claimCard(); payCard(); update(); };
document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  const ta = document.getElementById(b.dataset.copy);
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); try { document.execCommand('copy'); } catch (_) {} }
  b.textContent = T().copied; setTimeout(() => { b.textContent = T().copy; }, 1500);
}));
$('#print').addEventListener('click', () => window.print());
$('#reset').addEventListener('click', () => { $('#claims').innerHTML = ''; $('#pays').innerHTML = ''; $('#rate').value = 5; $('#incl').checked = false; $('#r05').checked = false; $('#basis').value = 'act365'; setToday(); claimCard(); update(); });
document.querySelectorAll('[data-lang-set]').forEach(b => b.addEventListener('click', () => { LANG = b.dataset.langSet; store.set('lang', LANG); applyLang(); }));

function applyTheme(th) {
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); else document.documentElement.removeAttribute('data-theme');
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === (th || 'auto'))));
}
document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { const th = b.dataset.themeSet; store.set('theme', th); applyTheme(th); }));
applyTheme(store.get('theme', 'auto'));

// Lien vers le code source (art. 13 AGPL), lorsque l’outil est servi par GitHub Pages
function setSource() {
  const h = location.hostname;
  if (/\.github\.io$/.test(h)) {
    const user = h.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0];
    const url = `https://github.com/${user}${repo ? '/' + repo : ''}`;
    $('#srcLink').innerHTML = `${T().source} <a href="${url}">${url.replace('https://', '')}</a>`;
  } else $('#srcLink').hidden = true;
}
function setToday() { const d = new Date(); $('#calc').value = I.toISO(I.dn(d.getFullYear(), d.getMonth() + 1, d.getDate())); }

// ---------- Démarrage ----------
setToday();
claimCard();
const qs = new URLSearchParams(location.search);
if (qs.get('lang') === 'en' || qs.get('lang') === 'fr') { LANG = qs.get('lang'); store.set('lang', LANG); }
applyLang();
})();
</script>
